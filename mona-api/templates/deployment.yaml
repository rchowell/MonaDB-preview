apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${K8S_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: mona-db
    app.kubernetes.io/instance: ${K8S_NAME}
    mona.db/id: ${DB_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ${K8S_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mona-db
        app.kubernetes.io/instance: ${K8S_NAME}
        mona.db/id: ${DB_ID}
    spec:
      containers:
        - name: mona-db
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONADB_ADDR
              value: "0.0.0.0:27017"
            - name: MONADB_DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${K8S_NAME}-data
