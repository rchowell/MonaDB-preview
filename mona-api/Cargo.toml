[package]
name = "mona-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate_models"
path = "src/bin/generate_models.rs"
required-features = ["generate"]

[features]
default = []
generate = ["dep:typify", "dep:prettyplease", "dep:syn", "dep:schemars"]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Codegen-only (enabled via `--features generate`)
typify = { version = "0.4", optional = true }
prettyplease = { version = "0.2", optional = true }
syn = { version = "2", features = ["full"], optional = true }
schemars = { version = "0.8", optional = true }
