[project]
name = "monadb-e2e"
version = "0.1.0"
description = "End-to-end MongoDB wire protocol tests for MonaDB using Motor"
requires-python = ">=3.11"
dependencies = [
    "motor>=3.6",
]

[project.scripts]
e2e = "e2e:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2e"]
