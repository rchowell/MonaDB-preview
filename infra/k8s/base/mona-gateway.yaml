apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mona-gateway-data
  namespace: mona
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mona-gateway
  namespace: mona
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mona-gateway
  template:
    metadata:
      labels:
        app: mona-gateway
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: mona-gateway
          image: mona-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
            - name: health
              containerPort: 8080
          env:
            - name: GATEWAY_LISTEN
              value: "0.0.0.0:27017"
            - name: HEALTH_LISTEN
              value: "0.0.0.0:8080"
            - name: DATA_DIR
              value: /data
            - name: LRU_MAX_TENANTS
              value: "32"
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mona-gateway-data
---
apiVersion: v1
kind: Service
metadata:
  name: mona-gateway
  namespace: mona
spec:
  type: ClusterIP
  selector:
    app: mona-gateway
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
