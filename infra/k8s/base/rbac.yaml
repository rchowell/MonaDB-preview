apiVersion: v1
kind: ServiceAccount
metadata:
  name: mona-api
  namespace: mona
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mona-api
  namespace: mona
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mona-api
  namespace: mona
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mona-api
subjects:
  - kind: ServiceAccount
    name: mona-api
    namespace: mona
