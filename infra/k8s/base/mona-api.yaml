apiVersion: apps/v1
kind: Deployment
metadata:
  name: mona-api
  namespace: mona
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mona-api
  template:
    metadata:
      labels:
        app: mona-api
    spec:
      serviceAccountName: mona-api
      containers:
        - name: mona-api
          image: mona-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://mona:mona@postgres:5432/mona
            - name: EDGE_DOMAIN
              value: mona.local
            - name: MONADB_IMAGE
              value: mona-db:local
            - name: K8S_NAMESPACE
              value: mona
            - name: TEMPLATES_DIR
              value: /app/templates
            - name: IDLE_TIMEOUT_SECONDS
              value: "300"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mona-api
  namespace: mona
spec:
  type: NodePort
  selector:
    app: mona-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
